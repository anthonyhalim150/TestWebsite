<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMate - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ff7f50;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="shop.html"><strong>ShopMate</strong></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id = "navbar-links">
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container my-5">
        <h2>Login</h2>
        <form id="login_form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <!-- form-control itu class dari bootstrap, yang biar neat -->
            <!-- required makes the field required-->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div id="login_message" class="mt-3 text-danger"></div>
    </main>
    
    <footer class="bg-orange text-white text-center py-3">
        <p>&copy; 2024 ShopMate. All Rights Reserved.</p>
    </footer>

    <script src="login.js"></script>
    <script src="items.js"></script>
</body>
</html>
