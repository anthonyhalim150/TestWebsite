<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMate - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ff7f50;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html"><strong>ShopMate</strong></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id = "navbar-links">
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container my-5">
        <h2>Sign Up</h2>
        <form id="sign-up-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <div id="signup_message" class="mt-3 text-danger"></div>
        <div class="mt-4 text-center">
            <p>
                <span class="text-secondary">Already have an account? </span>
                <a class="blue-link" href="login.html" class="text-primary fw-bold">Login here</a>
            </p>
        </div>
    </main>
    
    <footer class="bg-orange text-white text-center py-3">
        <p>&copy; 2024 ShopMate. All Rights Reserved.</p>
    </footer>
    <script src= "items.js"></script>
    <script src= "signup.js"></script>
</body>
</html>
