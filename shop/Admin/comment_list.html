<!-- product_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="admin.css"> 
    <link rel="stylesheet" href="../shop.css">
    <script defer src = "admin.js"> </script>
    <script defer src = "comment_list.js"></script>

</head>
<body>
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search items...">
    </div>  
    <main class="main-content">
        <section id="product-list" class="product-list">
            <h2>User Comments</h2>
            <table id="product-container">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Comments</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id = "product-container tbody">
                    <!-- Dynamically filled with products -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
</body>
</html>
