<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../shop.css">
    <script defer src="admin.js"></script>
    <script defer src="comment_list.js"></script>
</head>
<body>
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search items...">
    </div>  
    <main class="main-content">
        <section id="product-list" class="product-list">
            <h2>User Comments</h2>
            <table id="product-container">
                <thead>
                    <tr>
                        <th>Importance</th>
                        <th>Username</th>
                        <th>Comments</th>
                        <th>User Rating</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="product-container-tbody">
                    <!-- Dynamically filled with products -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Feedback Page for editing feedback -->
    <div id="feedback-page" class="feedback-page hidden">
        <div class="feedback-content">
            <span id="close-feedback" class="close">&times;</span>
            <h3>Edit Feedback</h3>
            <form id="feedback-form">
                <p id="comment-text"></p> <!-- Comment will be displayed here -->

                <!-- Importance Rating -->
                <div class="rating-container">
                    <label>Importance Rating:</label>
                    <div id="importance-stars" class="rating-stars">
                        <!-- Dynamically filled with exclamation marks -->
                    </div>
                    <input type="number" id="importance-rating" min="1" max="5" required>
                </div>

                <!-- Website Rating -->
                <div class="rating-container">
                    <label>Website Rating:</label>
                    <div id="website-stars" class="rating-stars">
                        <!-- Dynamically filled with stars -->
                    </div>
                    <input type="number" id="website-rating" min="1" max="5" required>
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
    <style>
        /* Feedback Page styling */
        .feedback-page.hidden { display: none; }
        .feedback-page {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 8px;
            height: 600px;
            width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .feedback-content {
            text-align: center;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
        .rating-container {
            margin-bottom: 20px;
            text-align: left;
        }
        .rating-stars {
            font-size: 20px;
            margin: 10px 0;
        }
        .rating-stars span {
            margin-right: 5px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .comment-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</body>
</html>
