<!-- metrics.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Metrics</title>
    <link rel="stylesheet" href="admin.css"> <!-- Link to your CSS file -->
    <link rel="stylesheet" href="../shop.css">
    <script defer src="admin.js"></script> 
    <script defer src="metrics.js"></script> 
</head>
<body>
    <main class="main-content">
        <section id="shop-metrics" class="metrics">
            <h2>Shop Metrics</h2>
            <div class="metrics-container">
                <div class="metric card">
                    <p><strong>Total Sales:</strong> $<span id="total-sales">0</span></p>
                </div>
                <div class="metric card">
                    <p><strong>Total Items Sold:</strong> <span id="total-items-sold">0</span></p>
                </div>
                <div class="metric card">
                    <p><strong>Total Products in Stock:</strong> <span id="total-products-in-stock">0</span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
</body>
</html>
