<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Auction</title>
  <link rel="stylesheet" href="auction.css">
</head>
<body>
  <header>
    <div class="navbar">
      <h1>My Bids</h1>
      <div class="controls">
        <input type="text" id="search-input" placeholder="Search items...">
        <select id="sort-select">
          <option value="">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
        </select>
      </div>
      <div class="header-icons">
        <a id="customer-support" title="Customer Support">
          <img src="Icons/auction-customer-support.png" alt="Customer Support Icon">
        </a>
        <a href="auction.html" title="Auction">
          <img src="Icons/auction.png" alt="Auction Icon">
        </a>
        <a href="index.html" title="Home">
          <img src="Icons/home-icon.png" alt="Home Icon">
        </a>
    </div>
  </header>

  <main class="auction-container">
    <div id="auction-items"></div>
  </main>

  <section id="product-overview" class="product-overview">
    <button class="close-btn">&times;</button>
    <img id="product-image" class="product-image" src="" alt="Product Image">
    <div class="details">
      <label for="product-name">Name:</label>
      <input type="text" id="product-name" readonly>

      <label for="product-price">Starting Price:</label>
      <input type="number" id="product-price" readonly>

      <label for="product-stock">Stock:</label>
      <input type="number" id="product-stock" readonly>

      <label for="product-description">Description:</label>
      <textarea id="product-description" readonly></textarea>

      <label for="product-category">Category:</label>
      <input type="text" id="product-category" readonly>

    </div>
  </section>

  <script src="my_bids.js"></script>
</body>
</html>
