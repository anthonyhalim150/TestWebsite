<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8"> 
<!-- Makes the website responsive to fit different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>3D Car Driving Map</title> 
  <!-- Links to an external CSS file for styling -->
  <link rel="stylesheet" href="styles.css"> 
</head>

<body>
  <!-- An empty `div` where the Three.js renderer will attach the 3D canvas -->
  <div id="container"></div> 
  <!-- Loads the Three.js library from a CDN to use its functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script> 
  <!-- Loads your custom JavaScript code for the 3D map and car -->
  <script type="module" src="script.js"></script> 
</body>
</html>
