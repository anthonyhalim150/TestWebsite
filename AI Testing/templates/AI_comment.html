<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comment Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 20px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Comment Analysis</h1>
        <textarea id="commentInput" placeholder="Enter a comment to analyze..."></textarea>
        <button onclick="analyzeComment()">Analyze</button>
        <div id="results" class="results" style="display: none;">
            <h3>Results</h3>
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        async function analyzeComment() {
            const comment = document.getElementById('commentInput').value;
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment })
            });
            const data = await response.json();

            const resultsDiv = document.getElementById('results');
            const resultText = document.getElementById('resultText');

            if (data.status === 'success') {
                resultText.innerText = JSON.stringify(data.ratings, null, 2);
                resultsDiv.style.display = 'block';
            } else {
                resultText.innerText = `Error: ${data.message}`;
                resultsDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
