<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Feedback and Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="static/AI_comment.css"></style>
    <script src="static/AI_comment.js"></script>
</head>
<body>

<div class="container">
    <h1>AI Feedback and Chatbot</h1>

    <!-- Feedback Summary and Suggestions -->
    <div id="feedback-section">
        <div class="card">
            <h2>Feedback Analysis</h2>
            <div id="loading-feedback" class="loading">Loading feedback...</div>
            <div id="error-feedback" class="error" style="display:none;"></div>

            <div id="summaries" class="feedback-summary"></div>
            <div id="suggestions" class="suggestions"></div>
        </div>
    </div>

    <!-- Chatbot Section -->
    <div id="chat-container" class="chat-container">
        <div class="card">
            <h2>Chat with AI</h2>
            <div id="loading-chat" class="loading">Loading...</div>
            <div class="chat-box" id="chat-box"></div>
            <textarea class="chat-input" id="user-input" placeholder="Ask something..."></textarea>
            <button class="chat-button" id="send-chat">Send</button>
        </div>
    </div>
</div>

</body>
</html>
