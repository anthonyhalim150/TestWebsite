<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Celebration </title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      color: #333;
      background: linear-gradient(135deg, #ff5c8d, #ff6fb5); /* Vibrant pink gradient */
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrolling due to floating hearts */
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: rgba(255, 204, 213, 0.8); /* Semi-transparent pink */
      border-bottom: 2px solid #ff6fb5;
    }
    header h1 {
      color: #ff3366;
      margin: 0;
    }
    nav {
      text-align: center;
      background-color: #fff;
      padding: 10px;
    }
    nav a {
      margin: 0 10px;
      color: #ff3366;
      text-decoration: none;
      font-weight: bold;
    }
    .section {
      padding: 40px;
      max-width: 800px;
      margin: auto;
      text-align: center;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .gallery img {
      max-width: 100%;
      border-radius: 10px;
      margin: 10px;
    }
    footer {
      background-color: rgba(255, 204, 213, 0.8);
      padding: 20px;
      text-align: center;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff3366;
      animation: float 5s infinite ease-in-out;
      opacity: 0.8;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff3366;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      left: 10px;
      top: 0;
    }
    /* Heart Animation */
    @keyframes float {
      0% {
        transform: translateY(100vh);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<!-- Floating Hearts -->
<div class="heart" style="left: 10%; animation-delay: 0s;"></div>
<div class="heart" style="left: 20%; animation-delay: 1s;"></div>
<div class="heart" style="left: 30%; animation-delay: 2s;"></div>
<div class="heart" style="left: 40%; animation-delay: 3s;"></div>
<div class="heart" style="left: 50%; animation-delay: 4s;"></div>
<div class="heart" style="left: 60%; animation-delay: 1.5s;"></div>
<div class="heart" style="left: 70%; animation-delay: 2.5s;"></div>
<div class="heart" style="left: 80%; animation-delay: 3.5s;"></div>
<div class="heart" style="left: 90%; animation-delay: 0.5s;"></div>

<header>
  <h1>Happy Anniversary, Patty!</h1>
  <p>C....</p>
</header>

<nav>
  <a href="#our-story">Our Story</a>
  <a href="#gallery">Gallery</a>
  <a href="#milestones">Milestones</a>
  <a href="#messages">Messages</a>
</nav>

<section id="our-story" class="section">
  <h2>Our Story</h2>
  <p>Blalala... say something about first meeting</p>
  <p>Blalala</p>
</section>

<section id="gallery" class="section gallery">

  <img src="photo1.jpg" alt="Memorable Moment">
  <img src="photo2.jpg" alt="Another Memory">

</section>

<section id="milestones" class="section">

  <ul>
    <li><strong>Year -:</strong> [Event description]</li>

</section>

<section id="messages" class="section">

  <p>“Congratulations...."</p>
  <p>“Wish..."</p>
</section>

<footer>
  <p>&copy; blabla</p>
</footer>

</body>
</html>
